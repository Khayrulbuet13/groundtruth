    <meta name="apple-mobile-web-app-title" content="groundtruth" />

    <meta property="og:type" content="website" />

    <meta
      property="og:description"
      content="LeetCode-style practice for computer vision and ML interview questions. Every answer is explained and cited. Works offline."
    />
    <meta property="og:url" content="https://gt.khayrul.me/" />
    <meta property="og:image" content="https://gt.khayrul.me/og-image.png" />

    <title>groundtruth</title>
    <script>
      (function () {
        try {
          var key = 'quiz-theme';
          var pref = localStorage.getItem(key);
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#1d1e20' : '#ffffff';
        } catch (e) {
          /* localStorage blocked (private mode) — fall back to default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
