<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Pick a topic, set the format, go. Every answer is explained and cited. Works offline, sync is optional."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>groundtruth</title>
    <script>
      (function () {
        try {
          var key = 'quiz-theme';
          var pref = localStorage.getItem(key);
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#1d1e20' : '#ffffff';
        } catch (e) {
          /* localStorage blocked (private mode) — fall back to default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
