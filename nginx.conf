events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Behind Cloudflare Tunnel every request reaches us from cloudflared, so $remote_addr
    # would be the same LAN/container address for all visitors and the backend rate
    # limiter would put everyone in one bucket. Trust CF-Connecting-IP only when the hop
    # is a private address (cloudflared / a local reverse proxy); direct hits keep their own IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name gt.khayrul.me localhost;
        root /usr/share/nginx/html;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /data/ {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
