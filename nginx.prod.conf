# Production nginx with TLS — enable via: docker compose --profile production up -d
# Not used when a tunnel or upstream proxy already terminates TLS (see deploy/DEPLOY.md).
# Kept for direct-TLS deployments where this nginx owns the certificate.
events { worker_connections 1024; }
http {
    upstream frontend { server frontend:80; }
    upstream backend { server backend:8000; }

    server {
        listen 80;
        server_name gt.khayrul.me;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name gt.khayrul.me;
        ssl_certificate /etc/letsencrypt/live/gt.khayrul.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gt.khayrul.me/privkey.pem;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
